# Version web de BPlaysure (GitHub Pages, branche gh-pages)
# À chaque version publiée : extrait la partie web de l'APK et la dépose sur la branche gh-pages.
name: Version web

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publier la partie web de la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "Dernière version : $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir apk
          unzip -q apk/*.apk 'assets/www/*' -d x
          mkdir site
          cp -r x/assets/www/. site/
          rm -rf site/ag            # modèle Ahegao : chargé depuis son projet d'origine
          rm -f site/leash.html site/screen.html
          echo "$TAG" > site/version.txt
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Version web $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
